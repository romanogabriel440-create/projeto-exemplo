<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CineCadastro - Filme Favorito</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #111322, #292044);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #1D2033;
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
        }

        h1 {
            color: #ffffff;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitulo {
            color: #aaaac0;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        label {
            display: block;
            color: #e5e7eb;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #393d54;
            border-radius: 8px;
            background: #292d43;
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 8px rgba(139, 92, 246, 0.3);
        }

        input::placeholder {
            color: #85869c;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #7c3aed;
            transform: translateY(-2px);
        }

        hr {
            border: none;
            border-top: 1px solid #393d54;
            margin: 25px 0;
        }

        .resultado-titulo {
            color: white;
            font-size: 18px;
            margin-bottom: 12px;
        }

        #resultado {
            color: #c4b5fd;
            font-size: 15px;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        .rodape {
            color: #777b96;
            text-align: center;
            font-size: 12px;
            margin-top: 25px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎬 CineCadastro</h1>

        <p class="subtitulo">
            Cadastre seus filmes favoritos!
        </p>

        <label for="filme">Nome do Filme</label>
        <input
            type="text"
            name="filme"
            id="filme"
            placeholder="Digite o nome do filme"
        >

        <label for="ano">Ano do Filme</label>
        <input
            type="number"
            name="ano"
            id="ano"
            placeholder="Ex: 2025"
        >

        <label for="nota">Nota do Filme (0 a 10)</label>
        <input
            type="number"
            name="nota"
            id="nota"
            placeholder="Digite uma nota"
            min="0"
            max="10"
            step="0.1"
        >

        <button id="btnMostrar" type="button">
            ✨ Mostrar Resultado
        </button>

        <hr>

        <h2 class="resultado-titulo">
            📽️ Resultado
        </h2>

        <p id="resultado">
        </p>

        <p class="rodape">
            © 2026 CineCadastro - Todos os direitos reservados
        </p>

    </div>

    <script src="js/filme.js"></script>

</body>
</html>
